[colors]
bg          = #00000000   ; fully transparent background
bg-solid    = #202b15     ; black-olive (if you ever want a solid bar)

fg          = #bfc5c6     ; silver-sand (your main text color)
accent      = #7ea55b     ; asparagus (highlight green)
accent2     = #4a713f     ; fern-green (darker green edge)
alt         = #8c999b     ; granny-smith (soft grey-green)
muted       = #4a5a56     ; nandor (muted teal/grey)
dim         = #485131     ; verdigris (dim olive)
highlight   = #70815c     ; limed-ash (soft moss)

active      = ${colors.accent}   ; same as your previous
alert       = #f53c3c

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; MAIN BAR
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[bar/main]

width = 100%
height = 28

offset-x = 0%
offset-y = 8
fixed-center = true

radius = 10

background = #00000000
foreground = #7ea55b

border-size = 0
border-color = #7ea55b

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=13"
font-1 = "Symbols Nerd Font:size=13"

module-margin = 1
padding-left = 2
padding-right = 2

enable-ipc = true
#wm-restack = i3

modules-left = xworkspaces sep5 avalanche
modules-center = infodrawer sep5 weather bluetooth 
modules-right = network microphone volume battery clock

[module/tray]
type = internal/tray
tray-position = right

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; INFO DRAWER BAR
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[bar/info]
monitor = ${env:MONITOR:}

width = auto
height = 26

offset-x = 50%:-50%
offset-y = 32

background = #00000000
foreground = #7ea55b

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=13"
font-1 = "Symbols Nerd Font:size=13"

module-margin = 1
padding-left = 4
padding-right = 4

#wm-restack = i3
enable-ipc = true

modules-left = hostname distro kernel uptime sep sep
modules-center = cpu memory swap temperature
modules-right = disk-boot disk-root disk-home disk-files

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; NHL Drawer
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[bar/nhldrawer]

monitor = ${env:MONITOR:}

width = 500
height = 26

offset-x = 50%:-50%
offset-y = 32

background = #00000000
foreground = #7ea55b

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=13"
font-1 = "Symbols Nerd Font:size=13"

module-margin = 1
padding-left = 4
padding-right = 4

#wm-restack = i3
enable-ipc = true

modules-left = avalanche

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; SYSTEM DRAWER BAR
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[bar/system]

monitor = ${env:MONITOR:}

width = auto
height = 26

offset-x = 50%:-50%
offset-y = 32

background = #00000000
foreground = #7ea55b

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=13"
font-1 = "Symbols Nerd Font:size=13"

module-margin = 1
padding-left = 4
padding-right = 4

#wm-restack = i3
enable-ipc = true

modules-center = cpu memory swap temperature

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; DISK DRAWER BAR
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[bar/disks]

monitor = ${env:MONITOR:}

width = auto
height = 26

offset-x = 50%:-50%
offset-y = 32

background = #01000000
foreground = #7ea55b

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=14"
font-1 = "Symbols Nerd Font:size=14"

module-margin = 1
padding-left = 4
padding-right = 4

#wm-restack = i3
enable-ipc = true

modules-center = disk-boot disk-root disk-home disk-files

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; DRAWER BUTTONS
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[module/sysdrawer]
type = custom/script
exec = echo " "
click-left = ~/.config/polybar/scripts/toggle_sys.sh
interval = 9999

[module/diskdrawer]
type = custom/script
exec = echo " "
click-left = ~/.config/polybar/scripts/toggle_disk.sh
interval = 9999

[module/nhldrawer]
type = custom/script
exec = echo "NHL"
click-left = ~/.config/polybar/scripts/toggle_nhl.sh
interval = 9999

[module/infodrawer]
type = custom/script
exec = echo "󰕮"
click-left = ~/.config/polybar/scripts/toggle_info.sh
interval = 9999

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; WORKSPACES
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true

label-focused = %name%
label-focused-foreground = ${colors.active}
label-focused-padding = 3

label-unfocused = %name%
label-unfocused-padding = 3

label-urgent = %name%
label-urgent-foreground = ${colors.alert}

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; SYSTEM MODULES
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/avalanche]
type = custom/script
exec = ~/.config/polybar/scripts/avalanche.sh
interval = 60
format = <label>
tail = true

[module/xworkspaces]
type = internal/xworkspaces

pin-workspaces = true
enable-click = false
enable-scroll = false

format = <label-state>

label-active = %name%
label-active-background = ${colors.accent}
label-active-foreground = ${colors.bg-solid}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.dim}
label-empty-padding = 1

[module/hostname]
type = custom/script
exec = cat /etc/hostname
interval = 600
format-prefix = "%{T2}󰇄%{T-} "

[module/distro]
type = custom/script
exec = grep "^PRETTY_NAME=" /etc/os-release | cut -d= -f2 | tr -d '"'
interval = 600
format-prefix = "%{T2}󰣇%{T-} "

[module/kernel]
type = custom/script
exec = uname -r
interval = 600
format-prefix = "%{T2}󰌢%{T-} "

[module/uptime]
type = custom/script
exec = uptime -p | sed 's/up //'
interval = 60
format-prefix = "%{T2}󰅐%{T-} "

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
label = CPU %percentage%%

[module/memory]
type = internal/memory
interval = 2
format = <label>
label = RAM %percentage_used%%

[module/swap]
type = custom/script
exec = ~/.config/polybar/scripts/swap.sh
interval = 5
format = <label>

[module/temperature]
type = internal/temperature
thermal-zone = 0
warn-temperature = 195

format = <label>
label =  %temperature-f%

format-warn = <label-warn>
label-warn =  %temperature-f%
label-warn-foreground = #f53c3c

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; DISK MODULES
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[module/disk-root]
type = internal/fs
mount-0 = /
interval = 60
label-mounted = / %free%

[module/disk-home]
type = internal/fs
mount-0 = /home
interval = 60
label-mounted = /home %free%

[module/disk-boot]
type = internal/fs
mount-0 = /boot
interval = 60
label-mounted = /boot %free%

[module/disk-files]
type = internal/fs
mount-0 = /Files
interval = 60
label-mounted = /Files %free%

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; OTHER MODULES
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 2
click-left = exec blueman
click-right = exec ~/.config/polybar/scripts/bluetooth.sh
format-padding = 1
;format-background = #aa282A2E
#format-background = #000000
format-foreground = #7ea55b

[module/network]
type = internal/network
interface = wlan0
interval = 3

format-connected = <ramp-signal> <label-connected>
label-connected = %essid%

format-disconnected = <label-disconnected>
label-disconnected = 󰖪

ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨

[module/battery]
type = internal/battery

battery = BAT0
adapter = AC

full-at = 98
low-at = 20

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 750

[module/backlight]
type = internal/backlight

card = amdgpu_bl1
use-actual-brightness = true

format = <ramp> <label>

label = %percentage%%

ramp-0 = %{F#555555}%{T2}󰃞%{T-}%{F-}
ramp-1 = %{F#7ea55b}%{T2}󰃟%{T-}%{F-}
ramp-2 = %{F#7ea55b}%{T2}󰃠%{T-}%{F-}
ramp-3 = %{F#39FF14}%{T2}󰃡%{T-}%{F-}
ramp-4 = %{F#39FF14}%{T2}󰃢%{T-}%{F-}

[module/volume]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>

ramp-volume-0 = %{T2}%{T-}
ramp-volume-1 = %{T2}%{T-}
ramp-volume-2 = %{T2}%{T-}

label-volume = %percentage%%
label-muted  = %{T2}󰝟%{T-}

scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%
click-left = pactl set-sink-mute @DEFAULT_SINK@ toggle

[module/microphone]
;format-prefix = " "
;label-muted = %{F#707880}  muted
type = custom/script
exec = ~/.config/polybar/scripts/pulseaudio-microphone.sh
tail = true
click-left = ~/.config/polybar/scripts/pulseaudio-microphone.sh --toggle &
scroll-up = ~/.config/polybar/scripts/pulseaudio-microphone.sh --increase &
scroll-down = ~/.config/polybar/scripts/pulseaudio-microphone.sh --decrease &

[module/weather]
type = custom/script
exec = ~/.config/polybar/scripts/weather.sh
interval = 600

[module/clock]
type = internal/date
interval = 1
date = %H:%M:%S %m/%d/%y
label = %date%
#label-foreground = ${colors.primary}

[module/idle]
type = custom/script
exec = echo "IDLE"
interval = 9999

[module/sep]
type = custom/text
format = " "

[module/sep5]
type =  custom/text
format =  "     "
